<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 296" role="img" aria-label="Sanatorio Otamendi">
  <defs>
    <filter id="otamendi-gray" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#AAAAAA" flood-opacity="1" result="gray"/>
      <feComposite in="gray" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <image href="logo_otamendi.png" x="0" y="0" width="292" height="296" preserveAspectRatio="xMidYMid meet" filter="url(#otamendi-gray)"/>
</svg>
