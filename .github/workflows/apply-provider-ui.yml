name: Apply provider UI patch

on:
  push:
    paths:
      - '.github/workflows/apply-provider-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '.brand{font-size:19px;font-weight:800;line-height:1;margin-top:2px}',
              '.brand{font-size:19px;font-weight:800;line-height:1;margin-top:2px;text-align:center}'
          )
          s = s.replace(
              '.project{font-size:10px;line-height:1.32;color:#f4dadd;margin-top:6px}',
              '.project{font-size:10px;line-height:1.32;color:#f4dadd;margin-top:6px;text-align:center}'
          )
          s = s.replace(
              '<table id="supplierTable"></table>',
              '<table id="supplierTable" class="supplier-table"></table>'
          )

          supplier_css = r'''.supplier-table th:not(:first-child),.supplier-table td:not(:first-child){text-align:center}.supplier-table th{vertical-align:middle}.supplier-table thead th{padding-top:7px;padding-bottom:7px}.provider-head{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:124px;line-height:1.05}.provider-head a{color:inherit;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}.provider-logo{width:34px;height:28px;display:flex;align-items:center;justify-content:center;margin-bottom:1px}.provider-logo svg{width:34px;height:28px;display:block}.provider-name{font-weight:800;font-size:9px;color:#302629;text-align:center}.provider-country{font-size:7.5px;color:var(--muted);font-weight:500}.supplier-table tbody td{vertical-align:middle}'''
          media_anchor = '@media(min-width:1500px) and (min-height:820px)'
          if '.provider-head{' not in s:
              s = s.replace(media_anchor, supplier_css + media_anchor)

          old_pattern = r"function renderSuppliers\(q=''\)\{.*?\}function renderGaps"
          new_block = r'''function providerLogo(id){const logos={certuma:`<svg viewBox="0 0 40 32" aria-hidden="true"><circle cx="20" cy="16" r="13" fill="#155da5"/><path d="M18 7h4v7h7v4h-7v7h-4v-7h-7v-4h7z" fill="#fff"/><path d="M8 16h24" stroke="#fff" stroke-width="1.4" opacity=".35"/></svg>`,oops:`<svg viewBox="0 0 40 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#7352b8"/><stop offset="1" stop-color="#e144ad"/></linearGradient></defs><circle cx="20" cy="8" r="6" fill="url(#g)"/><circle cx="12" cy="22" r="6" fill="#7051b7"/><circle cx="28" cy="22" r="6" fill="#d34daf"/><path d="M18 13l-4 4M22 13l4 4" stroke="#a556bb" stroke-width="3" stroke-linecap="round"/></svg>`,cloud:`<svg viewBox="0 0 40 32" aria-hidden="true"><path d="M11 25h19c4 0 7-3 7-7s-3-7-7-7c-1 0-2 0-3 .5C25.5 7.5 22 5 18 5c-5 0-9 3.5-9.8 8.2C5.2 14 3 16.4 3 19.5 3 22.5 5.5 25 8.5 25z" fill="none" stroke="#195fa7" stroke-width="2.4" stroke-linejoin="round"/></svg>`,guardia:`<svg viewBox="0 0 40 32" aria-hidden="true"><rect x="15" y="3" width="10" height="26" rx="4" fill="#119b9b"/><rect x="7" y="11" width="26" height="10" rx="4" fill="#119b9b"/><rect x="18.5" y="7" width="3" height="18" rx="1.5" fill="#d8ffff" opacity=".7"/></svg>`,uma:`<svg viewBox="0 0 48 32" aria-hidden="true"><text x="24" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#183f7a">üma</text></svg>`};return logos[id]||`<svg viewBox="0 0 40 32"><circle cx="20" cy="16" r="10" fill="#7c1420"/></svg>`}function renderSuppliers(q=''){const ss=DATA.suppliers||[],rows=(DATA.supplierCriteria||[]).filter(r=>r.criterion.toLowerCase().includes(q.toLowerCase()));$('#supplierTable').innerHTML='<thead><tr><th>Criterio</th>'+ss.map(s=>`<th><div class="provider-head"><a href="${esc(s.url)}" target="_blank" rel="noopener"><div class="provider-logo">${providerLogo(s.id)}</div><div class="provider-name">${esc(s.name)}</div><div class="provider-country">${esc(s.country)}</div></a></div></th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><td class="crit">'+esc(r.criterion)+'</td>'+ss.map(s=>`<td>${esc(r[s.id])}</td>`).join('')+'</tr>').join('')+'</tbody>'}function renderGaps'''
          s2, n = re.subn(old_pattern, new_block, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Could not replace renderSuppliers; matches={n}')

          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit dashboard update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-provider-ui.yml
          git add index.html .github/workflows/apply-provider-ui.yml
          git commit -m "Apply provider logos and sidebar alignment"
          git push
