name: Publicar tablero en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar logo Otamendi
        run: |
          sed -i 's|logo_otamendi.svg?v=20260914-1|logo_otamendi.png?v=20260914-5|g' index.html
          sed -i 's|logo_otamendi.png?v=20260914-3|logo_otamendi.png?v=20260914-5|g' index.html
          sed -i 's|logo_otamendi.png?v=20260914-4|logo_otamendi.png?v=20260914-5|g' index.html
          sed -i 's|filter:brightness(0) invert(1);opacity:1|filter:invert(70%);opacity:1|g' index.html
          sed -i 's|filter:invert(68%);opacity:1|filter:invert(70%);opacity:1|g' index.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
