name: Publicar tablero en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Curar benchmarks Argentina y LATAM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('data.json'); d=json.loads(p.read_text(encoding='utf-8'))
          by={x.get('name'):x for x in d.get('argentina',[])}
          by['Hospital Austral'].update({'model':'Triage presencial estructurado + triage virtual','responsible':'Enfermería en presencial · profesional en triage virtual','scale':'5 niveles institucionales','technology':'VITA HCE + triage digital + Portal del Paciente + Guardia Virtual integrada','status':'Productivo · validado','statusClass':'ok','key':'~650 pacientes/día en Emergencias; ~20% requiere mayor complejidad/observación. Todo paciente adulto o pediátrico pasa por triage.','next':'Confirmar dotación simultánea de Enfermería, tiempo promedio, SLA por nivel, re-triage y eventual IA.','source':'Hospital Austral · Emergencias + Sistema de Triage + Guardia Programada + VITA + información institucional JCI','confirmed':True,'ai':False,'referenceType':'Caso productivo / referencia JCI'})
          by['Sanatorio Allende']={'name':'Sanatorio Allende','model':'Triage presencial estructurado + circuito diferenciado de demanda','responsible':'Enfermería capacitada','scale':'Clasificación de riesgo institucional · antecedente CTAS a validar como versión vigente','technology':'Triage digital / protocolo estandarizado + flujo digital de Emergencias','status':'Productivo · validado','statusClass':'ok','key':'Guardia 24/7/365 en Nueva Córdoba y Cerro. Enfermería realiza evaluación inicial, signos vitales y clasificación de riesgo. Sala específica de triage; reevaluación y recategorización si se supera la espera. Nueva Córdoba: lunes/martes ~32% más demanda; picos 10 y 19 h.','next':'Confirmar escala vigente, niveles/SLA, dotación simultánea, pacientes/día, tiempo medio e integración exacta con HCE.','source':'Sanatorio Allende · Emergencias + Dirección de Enfermería + Calidad/JCI','confirmed':True,'ai':False,'referenceType':'Caso productivo / referencia JCI'}
          by['Swiss Medical Group · Los Arcos']={'name':'Swiss Medical Group · Los Arcos','model':'Triage presencial estructurado + gestión digital de demanda','responsible':'Enfermería como modelo SMG · dotación actual Los Arcos a confirmar','scale':'Niveles institucionales · escala vigente a confirmar','technology':'Triage + HCE + Guardia Ágil / fila virtual + canales digitales','status':'Productivo · validado','statusClass':'ok','key':'Swiss implementó triage en SM Center Pueyrredón desde 2011; referencia histórica ~400.000 atenciones/año. Resultados publicados: Nivel 2 82→28 min (-65%); Nivel 3 113→51 min (-59%). Los Arcos documenta triage al ingreso por complejidad y Guardia Ágil gestiona la espera digital en la red.','next':'Confirmar escala y dotación actual de Los Arcos, pacientes/día, tiempo de clasificación e integración triage-HCE.','source':'Swiss Medical Group · Æqualis Triage intrahospitalario + Sanatorio de los Arcos + Guardia Ágil','confirmed':True,'ai':False,'referenceType':'Caso productivo / referencia de implementación'}
          by['Hospital Británico']={'name':'Hospital Británico','model':'Triage / priorización presencial + gestión digital de espera a validar','responsible':'A confirmar','scale':'A confirmar','technology':'HCE + gestión digital pública de pacientes en espera por especialidad','status':'Caso en seguimiento','statusClass':'part','key':'Guardia 24/7 de alta complejidad y herramienta digital de pacientes en espera por Clínica Médica, Pediatría, Traumatología y Ginecología. En preparación para acreditación JCI; no acreditado actualmente.','next':'Confirmar responsable, escala, dotación, puestos, pacientes/día, tiempo medio, SLA, re-triage e integración triage-HCE-cola.','source':'Hospital Británico · información institucional + Guardia en espera','confirmed':False,'ai':False,'referenceType':'Referencia digital / seguimiento'}
          preferred=['Hospital Italiano','Hospital Austral','Hospital Alemán','Hospital Privado Universitario de Córdoba','Sanatorio Allende','Swiss Medical Group · Los Arcos','SAP-RN · ALTEC + Google','Galeno · TTS (Trinidad Triage System)','Sanatorio Finochietto','Hospital Británico']
          d['argentina']=[by[n] for n in preferred if n in by]
          d['latam']=[
            {'name':'EsSalud · Red Asistencial La Libertad','country':'Perú','model':'Triaje digital con IA','provider':'EsSalud / desarrollo institucional','scale':'5 niveles','aiRole':'Analiza signos vitales/datos y sugiere prioridad','humanRole':'Médico de triaje evalúa y valida','evidence':'Productivo en 4 hospitales desde 2025 · ticket, llamado automático y pantalla de espera','priority':'Muy alta','priorityClass':'ok','productive':True,'jci':False},
            {'name':'Fundación Santa Fe de Bogotá','country':'Colombia','model':'Triage presencial estructurado de alta complejidad','provider':'Institucional','scale':'ESI / clasificación por prioridad','aiRole':'Sin evidencia de IA asignando triage; IA aplicada a circuitos tiempo-dependientes','humanRole':'Enfermería / equipo de Urgencias','evidence':'JCI reacreditada 2025 · ~84.000 casos/año (2022) · 98 camas de Urgencias','priority':'Muy alta','priorityClass':'ok','productive':True,'jci':True},
            {'name':'Fundación Valle del Lili','country':'Colombia','model':'Triage presencial estructurado + soporte digital','provider':'Institucional','scale':'5 niveles','aiRole':'Sin evidencia pública de IA clasificatoria en triage','humanRole':'Médicos + Enfermería','evidence':'JCI 2026 · software integrado a HCE · referencia histórica ~72.693 urgencias/año','priority':'Muy alta','priorityClass':'ok','productive':True,'jci':True},
            {'name':'Einstein Hospital Israelita','country':'Brasil','model':'Triage estructurado + ecosistema avanzado de soporte clínico','provider':'Institucional','scale':'ESI','aiRole':'IA diagnóstica/predictiva alrededor de Urgencias; no confirmada para prioridad inicial','humanRole':'Enfermería','evidence':'JCI · 9º ciclo evaluado en 2024 · referencia de Urgencias con ESI','priority':'Muy alta','priorityClass':'ok','productive':True,'jci':True},
            {'name':'UPA Campos Salles','country':'Brasil','model':'IA analítica + clasificación de riesgo','provider':'CloudSaúde / Sinamnese','scale':'Manchester / flujo propio','aiRole':'Recomienda y alerta','humanRole':'Enfermería decide','evidence':'8.000+ pacientes/mes · integración signos vitales · HL7/FHIR (proveedor)','priority':'Muy alta','priorityClass':'ok','productive':True,'jci':False},
            {'name':'Hospital Sírio-Libanês','country':'Brasil','model':'Urgencias de alta complejidad · triage a profundizar','provider':'Institucional','scale':'A confirmar','aiRole':'Ecosistema digital avanzado; rol específico de IA en triage a confirmar','humanRole':'A confirmar','evidence':'JCI hospitalaria desde 2007 · reacreditaciones periódicas','priority':'Alta','priorityClass':'ok','productive':True,'jci':True},
            {'name':'Subred Sur Occidente · Oportuna','country':'Colombia','model':'IA para monitoreo post-triage','provider':'Oportuna','scale':'Oportunidad por categoría','aiRole':'Alertas de espera y oportunidad','humanRole':'Equipo clínico','evidence':'>640.000 alertas · Triage 2: 29→18 min (institución)','priority':'Alta','priorityClass':'ok','productive':True,'jci':False},
            {'name':'Hospital Adriana Cousiño de Quintero · Smart Triage','country':'Chile','model':'Soporte digital/IA para triage y gestión de espera','provider':'Smart Lab / Smart Triage','scale':'Clasificación de Urgencias · detalle a confirmar','aiRole':'Apoya decisiones, prioridades, alertas y cola inteligente','humanRole':'Personal clínico de triage','evidence':'Pilotaje hospitalario · soporte a triage, monitoreo y experiencia del paciente','priority':'Alta','priorityClass':'ok','productive':False,'jci':False},
            {'name':'Clínica Imbanaco · Quirónsalud','country':'Colombia','model':'Triage digital estructurado','provider':'Treelogic / SET','scale':'SET','aiRole':'Software estructurado determina gravedad y apoya priorización por riesgo','humanRole':'Profesional de triage','evidence':'Implantación SET en Urgencias confirmada en abril de 2026','priority':'Alta','priorityClass':'ok','productive':True,'jci':False},
            {'name':'Subred Integrada Sur · Doc-Tok','country':'Colombia','model':'IA para recomendación de triage','provider':'Doc-Tok','scale':'Clasificación de triage mediante preguntas / algoritmo predictivo','aiRole':'Asistente IA propone clasificación y detecta criticidad','humanRole':'Validación profesional prevista','evidence':'Preincubación / piloto; no productivo','priority':'Alta','priorityClass':'part','productive':False,'jci':False}
          ]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Preparar identidad, responsive y sello JCI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          logo='''<div class="brand-lockup" aria-label="Sanatorio Otamendi"><img class="otamendi-seal-img" src="logo_som_gris.png?v=20260914-1" alt="Sanatorio Otamendi"></div>'''
          s=re.sub(r'<div class="brand-lockup"[^>]*>.*?</div>',logo,s,count=1,flags=re.S)
          css='''.brand-lockup{height:205px!important;margin:6px 0 10px!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:visible!important}.otamendi-seal-img{display:block!important;width:150px!important;height:auto!important;max-width:90%!important;object-fit:contain!important;filter:none!important;opacity:1!important}html,body{min-height:100%!important;height:auto!important;overflow-y:auto!important}.app{grid-template-columns:220px minmax(0,1fr)!important;width:100%;max-width:100vw;min-height:100vh!important;height:auto!important;overflow:visible!important}aside{height:100vh!important;position:sticky!important;top:0!important;overflow-y:auto!important}main{min-width:0!important;width:100%!important;height:auto!important;min-height:100vh!important;overflow:visible!important;padding-bottom:48px!important}.view.active{height:auto!important;max-height:none!important;overflow:visible!important}.table-wrap{max-height:none!important;height:auto!important;overflow-x:auto!important;overflow-y:visible!important}.cards{grid-template-columns:repeat(5,minmax(0,1fr))!important}.card{min-width:0!important}.card .value{overflow-wrap:anywhere}.grid2{grid-template-columns:minmax(0,1.5fr) minmax(250px,.72fr)!important;min-width:0}.panel,.status-box{min-width:0}.status-box p,.panel p{overflow-wrap:anywhere}.jci-accred{display:flex;align-items:center;gap:5px;margin-top:5px;width:max-content;max-width:100%;font-size:7.4px;font-weight:800;color:#6e4d00;line-height:1;white-space:nowrap}.jci-seal{width:21px;height:21px;min-width:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff2a8 0,#e9bd43 42%,#b77a00 100%);border:1px solid #b98511;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);color:#724a00;font-size:7px;font-weight:900;letter-spacing:-.2px}.jci-seal:before{content:'JCI'}@media(max-width:1250px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))!important}.grid2{grid-template-columns:1fr!important}}@media(max-width:900px){.app{grid-template-columns:190px minmax(0,1fr)!important}.cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}.brand-lockup{height:175px!important}.otamendi-seal-img{width:128px!important}}@media(max-width:700px){.app{grid-template-columns:1fr!important;overflow:visible!important}aside{position:relative!important;width:100%!important;height:auto!important}.cards{grid-template-columns:1fr!important}.brand-lockup{height:165px!important}.otamendi-seal-img{width:122px!important}}'''
          s=s.replace('</style>',css+'\n</style>',1)
          script='''<script>(function(){const jciNames=new Set(['Hospital Italiano','Hospital Alemán','Hospital Austral','Hospital Privado Universitario de Córdoba','Sanatorio Allende','Fundación Santa Fe de Bogotá','Fundación Valle del Lili','Einstein Hospital Israelita','Hospital Sírio-Libanês']);function addJciBadges(){document.querySelectorAll('tbody tr').forEach(row=>{const first=row.querySelector('td:first-child');if(!first||first.querySelector('.jci-accred'))return;const raw=first.textContent.replace(/\\s+/g,' ').trim();if(![...jciNames].some(name=>raw.includes(name)))return;const badge=document.createElement('div');badge.className='jci-accred';badge.title='Institución acreditada por Joint Commission International';badge.innerHTML='<span class="jci-seal" aria-hidden="true"></span><span>Acreditado JCI</span>';first.appendChild(badge);});}addJciBadges();new MutationObserver(addJciBadges).observe(document.body,{childList:true,subtree:true});window.addEventListener('load',addJciBadges,{once:true});})();</script>'''
          s=s.replace('</body>',script+'\n</body>',1); p.write_text(s,encoding='utf-8')
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
