name: Publicar tablero en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar identidad y responsive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          logo = '''<div class="brand-lockup" aria-label="Sanatorio Otamendi">
          <img class="otamendi-seal-img" src="logo_som_gris.png?v=20260914-1" alt="Sanatorio Otamendi">
          </div>'''

          s = re.sub(r'<div class="brand-lockup"[^>]*>.*?</div>', logo, s, count=1, flags=re.S)

          responsive = '''
          /* Ajuste estructural 14-09: logo Otamendi gris definitivo + tablero sin cortes */
          .brand-lockup{height:205px!important;margin:6px 0 10px!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:visible!important}
          .otamendi-seal-img{display:block!important;width:150px!important;height:auto!important;max-width:90%!important;object-fit:contain!important;filter:none!important;opacity:1!important}
          .app{grid-template-columns:220px minmax(0,1fr)!important;width:100%;max-width:100vw;overflow-x:hidden}
          main{min-width:0!important;width:100%!important;overflow-x:hidden!important}
          .cards{grid-template-columns:repeat(5,minmax(0,1fr))!important}
          .card{min-width:0!important}.card .value{overflow-wrap:anywhere}
          .grid2{grid-template-columns:minmax(0,1.5fr) minmax(250px,.72fr)!important;min-width:0}
          .panel,.status-box{min-width:0}.status-box p,.panel p{overflow-wrap:anywhere}
          @media(max-width:1250px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))!important}.grid2{grid-template-columns:1fr!important}}
          @media(max-width:900px){.app{grid-template-columns:190px minmax(0,1fr)!important}.cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}.brand-lockup{height:175px!important}.otamendi-seal-img{width:128px!important}}
          @media(max-width:700px){.app{grid-template-columns:1fr!important;overflow:visible}.cards{grid-template-columns:1fr!important}.brand-lockup{height:165px!important}.otamendi-seal-img{width:122px!important}}
          '''
          s = s.replace('</style>', responsive + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
